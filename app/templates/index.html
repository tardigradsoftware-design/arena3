<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emlak Kayıt Yönetimi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">🏠 <b>Emlak</b> <span>Kayıt Yönetimi</span></div>
  <div class="search">
    <input id="q" type="search" placeholder="Genel arama: ad, adres, telefon, proje, ID..." autocomplete="off">
    <button id="qclear" title="Temizle">×</button>
  </div>
  <div class="actions">
    <button id="btn-tasks" class="btn">✓ Görevler <em id="tasks-badge" class="badge" hidden></em></button>
    <button id="btn-tags" class="btn">🏷 Etiketler</button>
    <button id="btn-cols" class="btn">☰ Sütunlar</button>
    <button id="btn-export" class="btn primary">⬇ Dışa Aktar</button>
  </div>
</header>

<section id="stats" class="stats"><div class="loading">yükleniyor...</div></section>

<main class="tablewrap">
  <div class="toolbar">
    <div id="active-filters" class="afilters"></div>
    <div class="pager" id="pager-top"></div>
  </div>
  <div class="scroll">
    <table id="grid">
      <thead id="grid-head"></thead>
      <tbody id="grid-body"></tbody>
    </table>
  </div>
  <div class="toolbar bottom">
    <div id="count-info" class="count"></div>
    <div class="pager" id="pager-bottom"></div>
    <label class="perpage">Sayfa başına
      <select id="perpage">
        <option value="25">25</option>
        <option value="50" selected>50</option>
        <option value="100">100</option>
        <option value="200">200</option>
      </select>
    </label>
  </div>
</main>

<aside id="drawer" class="drawer" hidden>
  <div class="drawer-head">
    <div>
      <div id="drawer-title" class="drawer-title"></div>
      <div id="drawer-sub" class="drawer-sub"></div>
    </div>
    <button id="drawer-close" class="btn icon" title="Kapat">✕</button>
  </div>
  <div id="drawer-tags" class="drawer-tags"></div>
  <nav class="tabs" id="drawer-tabs">
    <button data-tab="info" class="active">Bilgiler</button>
    <button data-tab="revs">Revizyonlar <em id="cnt-revs"></em></button>
    <button data-tab="notes">Notlar <em id="cnt-notes"></em></button>
    <button data-tab="tasks">Görevler <em id="cnt-tasks"></em></button>
    <button data-tab="tags">Etiketler</button>
  </nav>
  <div class="drawer-body">
    <section id="tab-info"></section>
    <section id="tab-revs" hidden></section>
    <section id="tab-notes" hidden></section>
    <section id="tab-tasks" hidden></section>
    <section id="tab-tags" hidden></section>
  </div>
</aside>
<div id="drawer-bg" class="drawer-bg" hidden></div>

<div id="modal-root"></div>
<div id="toasts" class="toasts"></div>

<script src="/static/app.js"></script>
</body>
</html>
